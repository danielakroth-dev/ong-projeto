<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Patas & Laços</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Patas & Laços</h1>
        <nav aria-label="Navegação principal">
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal">☰</button>
            <ul class="menu" id="menu-principal">
                <li><a href="index.html">Início</a></li>
                <li>
                    <a href="projetos.html">Projetos</a>
                    <ul class="submenu">
                        <li><a href="projetos.html#doacoes">Doações</a></li>
                        <li><a href="projetos.html#voluntariado">Voluntariado</a></li>
                    </ul>
                </li>
                <li><a href="cadastro.html" aria-current="page">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastro</h2>
            <form id="cadastro-form">
                <fieldset>
                    <legend>Dados pessoais</legend>

                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" autocomplete="name" required>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>

                    <label for="nascimento">Data de nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" autocomplete="street-address" required>

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" autocomplete="address-level2" required>

                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" name="estado" autocomplete="address-level1" required>
                </fieldset>

                <button type="submit">Cadastrar</button>
                <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Patas & Laços. Todos os direitos reservados.</p>
    </footer>

    <script src="../js/cadastro.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>

    <main>

        <h2>Cadastro</h2>

        <form>

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome">

                <br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">

                <br><br>

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento">
<br><br>

<label for="cpf">CPF:</label>
<input type="text" id="cpf" name="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" required>
<br><br>

<label for="telefone">Telefone:</label>
<input type="text" id="telefone" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(00) 00000-0000" required>

</fieldset>
            <br>

            <fieldset>
                <legend>Endereço</legend>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco">

                <br><br>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade">

                <br><br>

                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado">
<br><br>

<label for="cep">CEP:</label>
<input type="text" id="cep" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" required>
            </fieldset>

            <br>

            <button type="submit">Cadastrar</button>

        </form>

    </main>
